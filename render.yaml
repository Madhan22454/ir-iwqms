services:
  - type: web
    name: ir-iwqms-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && bash start.sh"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ir-iwqms-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "https://madhan22454.github.io"
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: ir-iwqms-db
    databaseName: ir_iwqms
    user: admin
